<!DOCTYPE html>
<html lang="uk" class="font-sans">
  <head>
    <script>
      (function () {
        try {
          document.documentElement.classList.add('page-enter-pending');
          if (localStorage.getItem('iskcon-lang') === 'en') {
            document.documentElement.classList.add('i18n-pending');
          }
        } catch (_) {}
      })();
    </script>
    <style>html.i18n-pending body{visibility:hidden}html.page-enter-pending body{opacity:0}</style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Вайшнавське свято — святкова програма храму з кіртаном, лекцією та прасадом."
      data-i18n="page.vaishnavskeSvyato.description"
    />
    <meta name="theme-color" content="#e85d04" />
    <title data-i18n="page.vaishnavskeSvyato.title">Вайшнавське свято — Храм Харе Крішна у Харкові</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body
    class="font-sans text-base font-normal leading-normal text-gray-800 antialiased bg-white"
  >
    <div
      id="app"
      class="flex min-h-screen flex-col bg-white"
    >
      <header id="site-header" class="min-h-[4.25rem] md:min-h-20 bg-footer-cream/75 backdrop-blur-lg backdrop-saturate-150" data-site-header></header>
      <div class="flex min-w-0 flex-1 flex-col">
      <main class="py-6 md:py-16">
        <div class="mx-auto max-w-4xl px-6">
          <h1 class="mb-5 md:mb-8 text-center text-[calc(1.65rem+2px)] font-normal leading-tight text-brand md:text-[calc(2.0625rem+2px)]" data-i18n="content.holiday.h1">
            Вайшнавське свято
          </h1>
          <div class="space-y-6 rounded-2xl bg-[#FFFBF6] p-6 md:p-8">
            <figure class="overflow-hidden rounded-xl border border-gray-100 bg-white shadow-sm">
              <img
                src="%BASE_URL%images/holiday-card.png"
                data-i18n-alt="content.holiday.imageAlt"
                alt="Святкова афіша"
                class="w-full object-cover"
                width="724"
                height="1024"
                loading="lazy"
                decoding="async"
              />
            </figure>
            <div class="space-y-4 text-base leading-relaxed text-gray-600">
              <p data-i18n="content.holiday.p1">
                Вайшнавське свято об'єднує святковий кіртан, лекцію, молитву та прасад,
                щоб усі гості могли разом пережити особливу атмосферу духовного
                натхнення і радості.
              </p>
              <p data-i18n="content.holiday.p2">
                Цю сторінку можна буде наповнити анонсом найближчого свята, програмою,
                часом початку та іншими важливими деталями.
              </p>
            </div>
          </div>
        </div>
      </main>
      </div>
      <footer id="site-footer" data-site-footer></footer>
    </div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
