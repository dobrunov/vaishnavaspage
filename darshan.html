<!DOCTYPE html>
<html lang="uk" class="font-sans">
  <head>
    <script>
      (function () {
        try {
          document.documentElement.classList.add('page-enter-pending');
          if (localStorage.getItem('iskcon-lang') === 'en') {
            document.documentElement.classList.add('i18n-pending');
          }
        } catch (_) {}
      })();
    </script>
    <style>html.i18n-pending body{visibility:hidden}html.page-enter-pending body{opacity:0}</style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Даршан Божеств у храмі Харе Крішна (ISKCON) у Харкові — відвідування вівтаря, араті та спільної молитви."
      data-i18n="page.darshan.description"
    />
    <meta name="theme-color" content="#e85d04" />
    <title data-i18n="page.darshan.title">Даршан Божеств — Храм Харе Крішна у Харкові</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body
    class="font-sans text-base font-normal leading-normal text-gray-800 antialiased bg-white"
  >
    <div
      id="app"
      class="flex min-h-screen flex-col bg-white"
    >
      <header id="site-header" class="min-h-[4.25rem] md:min-h-20 bg-footer-cream/75 backdrop-blur-lg backdrop-saturate-150" data-site-header></header>
      <div class="flex min-w-0 flex-1 flex-col">
      <main class="py-6 md:py-16">
        <div class="mx-auto max-w-3xl px-6">
          <h1
            class="mb-5 md:mb-8 text-center text-[calc(1.65rem+2px)] font-normal leading-tight text-brand md:text-[calc(2.0625rem+2px)]"
            data-i18n="content.darshan.h1"
          >
            Даршан Божеств
          </h1>
          <div class="rounded-2xl bg-[#FFFBF6] p-6 md:p-8">
            <p class="mb-8 text-base leading-relaxed text-gray-600" data-i18n-html="content.darshan.introHtml">
              Даршан — «бачення» Божеств: спокійна присутність у вівтарі, спільні
              молитви та кіртан. Запрошуємо приєднатися до Манґала-араті, Гаура-араті
              та інших подій за
              <a href="schedule.html" class="text-brand underline-offset-2 hover:underline"
                >розкладом</a
              >.
            </p>
            <figure
              class="overflow-hidden rounded-xl border border-gray-100 bg-white shadow-sm"
            >
              <img
                src="%BASE_URL%images/darshan-deities.png"
                data-i18n-alt="content.darshan.imageAlt"
                alt="Божества у храмі Харе Крішна"
                class="w-full object-cover"
                width="1024"
                height="576"
                loading="lazy"
                decoding="async"
              />
            </figure>
          </div>
        </div>
      </main>
      </div>
      <footer id="site-footer" data-site-footer></footer>
    </div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
