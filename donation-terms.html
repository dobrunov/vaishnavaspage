<!DOCTYPE html>
<html lang="uk" class="font-sans">
  <head>
    <script>
      (function () {
        try {
          document.documentElement.classList.add('page-enter-pending');
          if (localStorage.getItem('iskcon-lang') === 'en') {
            document.documentElement.classList.add('i18n-pending');
          }
        } catch (_) {}
      })();
    </script>
    <style>html.i18n-pending body{visibility:hidden}html.page-enter-pending body{opacity:0}</style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content=""
      data-i18n="page.donationTerms.description"
    />
    <meta name="theme-color" content="#e85d04" />
    <title data-i18n="page.donationTerms.title">—</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body
    class="font-sans text-base font-normal leading-normal text-gray-800 antialiased bg-white"
  >
    <div
      id="app"
      class="flex min-h-screen flex-col bg-white"
    >
      <header
        id="site-header"
        class="min-h-[4.25rem] md:min-h-20 bg-footer-cream/75 backdrop-blur-lg backdrop-saturate-150"
        data-site-header
      ></header>
      <div class="flex min-w-0 flex-1 flex-col">
        <main class="py-5 md:py-12">
          <div class="mx-auto w-full max-w-2xl px-4 sm:px-6">
            <p class="mb-6">
              <a
                href="donations.html"
                class="text-sm font-medium text-brand transition hover:underline"
                data-i18n="content.donationCommon.backToList"
                >←</a
              >
            </p>
            <h1
              class="text-2xl font-semibold leading-tight text-gray-900 md:text-3xl"
              data-i18n="content.donationTerms.h1"
            >
              —
            </h1>
            <p
              class="mt-4 text-sm leading-relaxed text-gray-600"
              data-i18n="content.donationTerms.lead"
            >
              …
            </p>
            <div
              class="mt-8 rounded-2xl bg-[#FFFBF6] p-5 sm:p-6 md:p-8"
            >
              <div
                class="text-sm leading-relaxed"
                data-i18n-html="content.donationTerms.bodyHtml"
              ></div>
            </div>
          </div>
        </main>
      </div>
      <footer id="site-footer" data-site-footer></footer>
    </div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
