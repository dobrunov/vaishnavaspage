<!DOCTYPE html>
<html lang="uk" class="font-sans">
  <head>
    <script>
      (function () {
        try {
          document.documentElement.classList.add('page-enter-pending');
          if (localStorage.getItem('iskcon-lang') === 'en') {
            document.documentElement.classList.add('i18n-pending');
          }
        } catch (_) {}
      })();
    </script>
    <style>html.i18n-pending body{visibility:hidden}html.page-enter-pending body{opacity:0}</style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Трансляції та афіша лекцій з «Шрімад Бгаґаватам» — храм Харе Крішна, Харків."
      data-i18n="page.broadcast.description"
    />
    <meta name="theme-color" content="#e85d04" />
    <title data-i18n="page.broadcast.title">Трансляція — Храм Харе Крішна у Харкові</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body
    class="font-sans text-base font-normal leading-normal text-gray-800 antialiased bg-white"
  >
    <div
      id="app"
      class="flex min-h-screen flex-col bg-white"
    >
      <header id="site-header" class="min-h-[4.25rem] md:min-h-20 bg-footer-cream/75 backdrop-blur-lg backdrop-saturate-150" data-site-header></header>
      <div class="flex min-w-0 flex-1 flex-col">
      <main class="py-6 md:py-16">
        <div class="mx-auto max-w-md px-6 md:max-w-2xl lg:max-w-3xl">
          <h1
            class="mb-5 md:mb-8 text-center text-[calc(1.65rem+2px)] font-normal leading-tight text-brand md:text-[calc(2.0625rem+2px)]"
            data-i18n="content.broadcast.h1"
          >
            Трансляція лекцій
          </h1>
          <div class="rounded-2xl bg-[#FFFBF6] p-6 md:p-8">
            <div
              class="mb-8 flex flex-col items-center justify-center gap-3 text-center text-base leading-relaxed text-gray-600 sm:flex-row sm:text-left"
            >
              <a
                href="https://www.youtube.com/channel/UC6aTIMPbCOMH9yk6WRukj-A"
                class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-[#F70000] text-white shadow-sm transition hover:brightness-110 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600"
                aria-label="YouTube"
                rel="noopener noreferrer"
                target="_blank"
                ><i class="fab fa-youtube text-[1.35rem] leading-none" aria-hidden="true"></i></a
              >
              <p data-i18n="content.broadcast.blurb">
                Щодня о 8:00, а у неділю о 12:00 лекції по Шримад Бхагаватам
                дивіться на нашому каналі.
              </p>
            </div>
            <img
              src="%BASE_URL%images/bhagavatam-lectures-poster.png"
              data-i18n-alt="content.broadcast.posterAlt"
              alt="Афіша: лекції з «Шрімад Бгаґаватам» — розклад у Харкові"
              class="w-full rounded-xl shadow-md"
              width="724"
              height="1024"
              loading="lazy"
              decoding="async"
            />
          </div>
        </div>
      </main>
      </div>
      <footer id="site-footer" data-site-footer></footer>
    </div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
