<!DOCTYPE html>
<html lang="uk" class="font-sans">
  <head>
    <script>
      (function () {
        try {
          document.documentElement.classList.add('page-enter-pending');
          if (localStorage.getItem('iskcon-lang') === 'en') {
            document.documentElement.classList.add('i18n-pending');
          }
        } catch (_) {}
      })();
    </script>
    <style>html.i18n-pending body{visibility:hidden}html.page-enter-pending body{opacity:0}</style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Реквізити для пожертви — Храм Харе Крішна (ISKCON), Харків."
      data-i18n="page.donate.description"
    />
    <meta name="theme-color" content="#e85d04" />
    <title data-i18n="page.donate.title">Реквізити пожертви — Храм Харе Крішна у Харкові</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body
    class="font-sans text-base font-normal leading-normal text-gray-800 antialiased bg-white"
  >
    <div
      id="app"
      class="flex min-h-screen flex-col bg-white"
    >
      <header id="site-header" class="min-h-[4.25rem] md:min-h-20 bg-footer-cream/75 backdrop-blur-lg backdrop-saturate-150" data-site-header></header>
      <div class="flex min-w-0 flex-1 flex-col">
      <main class="py-6 md:py-16">
        <div class="mx-auto max-w-2xl px-6">
          <h1
            class="mb-5 md:mb-8 text-center text-[calc(1.65rem+2px)] font-normal leading-tight text-brand md:text-[calc(2.0625rem+2px)]"
            data-i18n="content.donate.h1"
          >
            Реквізити пожертви
          </h1>
          <div class="rounded-2xl bg-[#FFFBF6] p-6 md:p-8">
            <p class="mb-8 text-base leading-relaxed text-gray-600" data-i18n="content.donate.intro">
              Піклування про храм у Харкові, вегетаріанська їжа та наші програми
              можливі завдяки пожертвам. Щира вдячність за вашу підтримку!
            </p>
            <h2
              class="mb-1 text-sm font-semibold uppercase tracking-wide text-gray-500"
              data-i18n="content.donationForm.bankSectionTitle"
            >
              Або банківський переказ
            </h2>
            <p
              class="mb-4 text-sm font-medium text-gray-800"
              data-i18n="content.donate.purposeNote"
            ></p>
            <div
              class="rounded-xl border border-gray-100 bg-white p-6 text-base leading-relaxed text-gray-800 shadow-sm md:p-8"
            >
              <h3 class="mb-4 text-base font-semibold text-gray-900" data-i18n="content.donate.bankHeading">
                Банківські реквізити
              </h3>
              <dl class="space-y-3">
                <div>
                  <dt class="text-gray-500" data-i18n="content.donate.recipientLabel">Отримувач</dt>
                  <dd class="font-normal" data-i18n="content.donate.recipientName">Храм Харе Крішна, Харків</dd>
                </div>
                <div>
                  <dt class="text-gray-500" data-i18n="content.donate.ibanLabel">IBAN</dt>
                  <dd class="tabular-nums tracking-tight">
                    8999 2374 7773 2344
                  </dd>
                </div>
              </dl>
            </div>
          </div>
        </div>
      </main>
      </div>
      <footer id="site-footer" data-site-footer></footer>
    </div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
