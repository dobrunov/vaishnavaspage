<!DOCTYPE html>
<html lang="uk" class="font-sans">
  <head>
    <script>
      (function () {
        try {
          document.documentElement.classList.add('page-enter-pending');
          if (localStorage.getItem('iskcon-lang') === 'en') {
            document.documentElement.classList.add('i18n-pending');
          }
        } catch (_) {}
      })();
    </script>
    <style>html.i18n-pending body{visibility:hidden}html.page-enter-pending body{opacity:0}</style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Як доїхати до храму Харе Крішна у Харкові — адреса на Холодній Горі, громадський транспорт."
      data-i18n="page.howToGet.description"
    />
    <meta name="theme-color" content="#e85d04" />
    <title data-i18n="page.howToGet.title">Як доїхати — Храм Харе Крішна у Харкові</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body
    class="font-sans text-base font-normal leading-normal text-gray-800 antialiased bg-white"
  >
    <div
      id="app"
      class="flex min-h-screen flex-col bg-white"
    >
      <header id="site-header" class="min-h-[4.25rem] md:min-h-20 bg-footer-cream/75 backdrop-blur-lg backdrop-saturate-150" data-site-header></header>
      <div class="flex min-w-0 flex-1 flex-col">
      <main class="py-12 md:py-16">
        <div class="mx-auto max-w-2xl px-6">
          <h1
            class="mb-8 text-center text-[calc(1.65rem+2px)] font-normal leading-tight text-brand md:text-[calc(2.0625rem+2px)]"
            data-i18n="content.howToGet.h1"
          >
            Як доїхати
          </h1>
          <div class="rounded-2xl bg-[#FFFBF6] p-6 md:p-8">
            <p class="mb-8 text-base leading-relaxed text-gray-600" data-i18n="content.howToGet.intro">
              Храм розташований у районі Холодна Гора. Зручніше за все дістатися
              громадським транспортом до найближчої зупинки в цьому районі та
              пройти пішки за вказівниками на карті.
            </p>
            <div
              class="rounded-xl border border-gray-100 bg-white p-6 text-base leading-relaxed text-gray-800 shadow-sm md:p-8"
            >
              <h2 class="mb-4 text-base font-semibold text-gray-900" data-i18n="content.howToGet.addressHeading">
                Адреса храму
              </h2>
              <address class="not-italic text-gray-700" data-i18n-html="content.howToGet.addressHtml">
                вул. Холодногірська, 39<br />
                61098 Харків, Україна
              </address>
              <p class="mt-4 text-gray-600" data-i18n-html="content.howToGet.mapsHintHtml">
                Детальний маршрут можна побудувати в
                <a
                  href="https://www.google.com/maps/search/?api=1&query=%D0%A5%D0%BE%D0%BB%D0%BE%D0%B4%D0%BD%D0%BE%D0%B3%D1%96%D1%80%D1%81%D1%8C%D0%BA%D0%B0%2C%2039%2C%20%D0%A5%D0%B0%D1%80%D0%BA%D1%96%D0%B2"
                  class="text-brand underline-offset-2 hover:underline"
                  rel="noopener noreferrer"
                  target="_blank"
                  >Google Картах</a
                >.
              </p>
            </div>
          </div>
        </div>
      </main>
      </div>
      <footer id="site-footer" data-site-footer></footer>
    </div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
